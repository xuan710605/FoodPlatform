[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "foodplatform-api"
version = "0.3.0"
description = "FastAPI read API for FoodPlatform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.128,<0.129",
  "uvicorn[standard]>=0.40,<0.41",
  "pydantic>=2.12,<2.13",
  "pydantic-settings>=2.12,<2.13",
  "SQLAlchemy>=2.0.46,<2.1",
  "PyMySQL>=1.1.2,<1.2",
  "cryptography>=46,<47",
  "bcrypt>=5.0,<5.1",
  "PyJWT>=2.10,<2.11",
  "email-validator>=2.3,<2.4",
  "python-multipart>=0.0.22,<0.1",
  "neo4j>=6.1,<6.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<9.1",
  "httpx>=0.28,<0.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
